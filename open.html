<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключение</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F1620;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:20px;box-sizing:border-box}
.c{max-width:380px;width:100%}h1{font-size:24px;margin:0 0 8px}p{color:rgba(255,255,255,.7);line-height:1.5}
a,button{display:block;width:100%;margin-top:12px;padding:16px;border-radius:999px;border:0;font-weight:800;font-size:16px;font-family:inherit;text-decoration:none;cursor:pointer;box-sizing:border-box}
.p{background:linear-gradient(135deg,#ff9a1a,#ffb347);color:#1d1300}.o{background:transparent;border:1.5px solid rgba(255,154,26,.55);color:#ffb347}
</style>
</head>
<body>
<div class="c">
  <h1>Открываем Happ…</h1>
  <p id="m">Если ничего не произошло, нажми кнопку ниже. Happ должен быть установлен.</p>
  <a class="p" id="open" href="#">Открыть в Happ</a>
  <button class="o" id="copy">Скопировать ссылку</button>
</div>
<script>
// Ссылка подписки лежит после # и на сервер не отправляется
const link = decodeURIComponent(location.hash.slice(1));
const $ = id => document.getElementById(id);
if (!link) {
  $("m").textContent = "Ссылка не найдена. Вернись в бота и нажми «Подключиться» ещё раз.";
  $("open").style.display = "none"; $("copy").style.display = "none";
} else {
  const u = "happ://add/" + link;
  $("open").href = u;
  setTimeout(() => { location.href = u; }, 300);
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(link); }
    catch (e) { const t = document.createElement("textarea"); t.value = link; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    $("m").textContent = "Ссылка скопирована. В Happ нажми «Добавить из буфера обмена».";
  };
}
</script>
</body>
</html>
